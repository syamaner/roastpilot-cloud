name: Owner Command Issue Intake (Dark)

on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  intake:
    if: vars.OWNER_COMMAND_INTAKE_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    outputs:
      proceed: ${{ steps.intake.outputs.proceed }}
      verb: ${{ steps.intake.outputs.verb }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          sparse-checkout: scripts/factory
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Derive issue owner command
        id: intake
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TARGET_ISSUE_NUMBER: ${{ github.event.issue.number }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: node --experimental-strip-types scripts/factory/intake-owner-command-issue.mts

  # This dispatches ONLY the already-reviewed triage readiness promotion
  # (ready-to-spec -> ready-to-implement). It never dispatches
  # implement-ready-issues.yml or any contents: write workflow, and it never
  # reaches OWNER_TASK_APPLY_ENABLED.
  # Activation checklist: OWNER_COMMAND_INTAKE_ENABLED is shared with the
  # frozen owner-command-intake.yml, so C3 activation must account for both
  # workflows becoming active when the variable is set.
  dispatch-approve:
    needs: intake
    if: ${{ vars.OWNER_COMMAND_INTAKE_ENABLED == 'true' && needs.intake.outputs.proceed == 'true' && needs.intake.outputs.verb == 'approve' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch triage readiness promotion
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run triage-issues.yml --repo ${{ github.repository }} --ref main -f issue_number=${{ github.event.issue.number }} -f triage_mode=readiness
