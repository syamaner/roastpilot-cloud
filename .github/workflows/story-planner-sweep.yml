name: Story Planner Sweep (Dark)

on:
  workflow_dispatch:

permissions: {}

jobs:
  sweep:
    # Activation adds the pause gate plus the runbook's numeric workflow ID.
    if: vars.STORY_PLANNER_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    steps:
      - name: Checkout sweep scripts only
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: main
          sparse-checkout: scripts/factory

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Mint factory App token
        id: factory_token
        if: ${{ vars.FACTORY_PUBLISHER_APP_ID != '' }}
        continue-on-error: true
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ vars.FACTORY_PUBLISHER_APP_ID }}
          private-key: ${{ secrets.FACTORY_PUBLISHER_PRIVATE_KEY }}
          permission-issues: write

      - name: Sweep unplanned ready-to-spec issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FACTORY_APP_TOKEN: ${{ steps.factory_token.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node --experimental-strip-types scripts/factory/story-planner-sweep.mts
