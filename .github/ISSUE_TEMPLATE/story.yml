name: Story
description: A thin, implementable slice of an epic (factory intake — triage judges it against this bar)
title: "[Cx-Sx] "
labels: ["needs-triage"]
body:
  - type: input
    id: plan-link
    attributes:
      label: Plan link
      description: Which epic and section of the component plan this implements (link to roastpilot-plan lines).
      placeholder: "https://github.com/syamaner/roastpilot-plan/blob/main/roastpilot-cloud/plan.md — epic C2, §4"
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Checkboxes; each one independently verifiable. Triage will not pass a story whose criteria cannot be tested.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: in-scope
    attributes:
      label: In-scope surface
      description: Files / areas this story is expected to touch.
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: What this story deliberately does not do (and which story does).
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification notes
      description: Which suite proves this (unit / contract vs ROASTPILOT_DEV / Playwright e2e / grants), plus anything manual.
    validations:
      required: true
  - type: dropdown
    id: size
    attributes:
      label: Size declaration
      description: Choose the execution path and review-unit shape (D119-D122). About 400 changed logic lines is a guide for conventional work. The current factory publisher's exact technical envelope is one issue/commit/PR, at most 400 combined changed textual lines across every path category, a captured patch artifact no larger than 2 MiB, no binary patch, and no mixed inert output plus logic/tests. Any oversized or otherwise pre-open-QA-triggering work uses conventional execution.
      options:
        - "Factory-dispatchable — within the universal 400 textual-line and 2 MiB envelope"
        - "Factory-dispatchable output-only — data / generated / fixtures / docs, within 400 text lines and 2 MiB"
        - "Conventional/interactive — one or more coherent PR units, normally ~400 logic lines each"
        - "Conventional/interactive — justified materially larger cohesive unit"
    validations:
      required: true
  - type: textarea
    id: pr-plan
    attributes:
      label: PR plan
      description: For every review unit, state scope, rough changed logic/test lines, dependency/order, reviewers, and verification. A materially larger conventional unit must explain why available splits reduce reviewability.
      placeholder: |
        1. Scope: ...
           Rough size: ... logic / ... test lines
           Depends on: none
           Reviewers: ...
           Verification: ...
           Larger-unit rationale: ... (when applicable)
    validations:
      required: true
  - type: input
    id: domain-reviewer
    attributes:
      label: Domain reviewer
      description: Which reviewer this story's diff triggers per AGENTS.md's rubric (schema-migration-reviewer / privacy-auditor / factory-security-reviewer / qa), or "none (docs/fixtures only)". The qa pass is mandatory above 600 changed test-file lines or whenever test quality is otherwise load-bearing; either trigger requires conventional execution today.
      placeholder: "schema-migration-reviewer"
    validations:
      required: true
  - type: input
    id: depends-on
    attributes:
      label: Depends on
      description: Another story this one builds on (issue number or draft ID), or "none". Triage checks the order is stated, not implied.
      placeholder: "none"
    validations:
      required: true
